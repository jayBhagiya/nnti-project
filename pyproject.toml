[project]
name = "nnti-project-llms"
version = "0.1.0"
description = "Multilingual XGLM evaluation and Quechua adaptation experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
    "altair==5.2.0",
    "datasets==2.18.0",
    "h5py==3.10.0",
    "matplotlib==3.8.3",
    "numpy==1.26.4",
    "pandas==2.2.1",
    "scikit-learn==1.4.1.post1",
    "sentencepiece==0.2.0",
    "transformers==4.38.2",
    "wandb==0.22.3",
]

[project.optional-dependencies]
cpu = ["torch==2.2.2"]
cu118 = ["torch==2.2.2"]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu118" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu118", extra = "cu118" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
